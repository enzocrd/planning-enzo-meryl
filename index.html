<body>

<script>
const SUPA_URL="https://owreicuibckflowumrdk.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93cmVpY3VpYmNrZmxvd3VtcmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzc3NDQsImV4cCI6MjEwNTY1Mzc0NH0.8gTLzSwaEVsr24-gEhFkgO2QEOc-qheV67hxOBznLxI";
const HEADERS={apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let cur=new Date();cur.setDate(1);
let events=[];let selDate=null,selP='enzo',selT='travail',editId=null;
function setP(p){selP=p;document.getElementById('pEnzo').className='btn '+(p==='enzo'?'sel':'');document.getElementById('pMeryl').className='btn '+(p==='meryl'?'sel':'');}
function setT(t){
 selT=t;
 document.getElementById('tTravail').className='btn '+(t==='travail'?'sel':'');
 document.getElementById('tOff').className='btn '+(t==='off'?'sel':'');
 document.getElementById('tMission').className='btn '+(t==='mission'?'sel':'');
 document.getElementById('timeBox').style.display=t==='travail'?'block':'none';
 document.getElementById('missionBox').style.display=t==='mission'?'block':'none';
}
function fmtDateISO(d){return d.toISOString().slice(0,10);}
function parseISO(s){const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);}
function daysBetween(a,b){const d1=parseISO(a),d2=parseISO(b);const diff=Math.round((d2-d1)/86400000);return diff;}
async function load(){
 try{
  const r=await fetch(SUPA_URL+"/rest/v1/planning_events?select=*&order=date_key.asc",{headers:HEADERS});
  if(!r.ok) throw new Error(r.status+" "+await r.text());
  events=await r.json();
  document.getElementById('status').textContent=events.length+" créneaux - synchro "+new Date().toLocaleTimeString()+" - sauvegarde OK";
  document.getElementById('badge').className='badge';
  document.getElementById('badge').innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block"></span>● Connecté temps réel - Synchro active';
  render();
 }catch(e){
  document.getElementById('status').textContent="Erreur: "+e.message;
  document.getElementById('badge').className='badge err';
  document.getElementById('badge').textContent="● Erreur "+e.message;
 }
}
function render(){
 const y=cur.getFullYear(),m=cur.getMonth();
 document.getElementById('monthLabel').textContent=new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 const first=new Date(y,m,1);let start=(first.getDay()+6)%7;const dim=new Date(y,m+1,0).getDate();
 let html='';['L','M','M','J','V','S','D'].forEach(d=>html+=`<div class="dow">${d}</div>`);
 for(let i=0;i<start;i++) html+=`<div class="cell" style="opacity:.15"></div>`;
 // Build mission bars map
 const missionByDay={}; // date_key -> [missions]
 events.filter(e=>e.type==='mission').forEach(ev=>{
   const s=ev.departure_date||ev.date_key;const eD=ev.arrival_date||s;
   let curD=parseISO(s);const endD=parseISO(eD);
   while(curD<=endD){const k=fmtDateISO(curD);if(!missionByDay[k]) missionByDay[k]=[];missionByDay[k].push(ev);curD=new Date(curD.getFullYear(),curD.getMonth(),curD.getDate()+1);}
 });
 for(let d=1;d<=dim;d++){
  const k=fmtDateISO(new Date(y,m,d));
  const de=events.filter(x=>x.date_key===k&&x.type!=='mission');
  const missions=missionByDay[k]||[];
  const enzoOff=de.some(x=>x.person==='enzo'&&x.type==='off')||missions.some(x=>x.person==='enzo'&&x.type==='mission'?false:de.some(x=>x.person==='enzo'&&x.type==='off'))||events.some(x=>x.person==='enzo'&&x.type==='off'&&x.date_key===k);
  // simplified: check off directly + mission off? Actually off commun only for off type
  const offs=events.filter(x=>x.date_key===k&&x.type==='off');
  const enzoOffReal=offs.some(x=>x.person==='enzo');const merylOffReal=offs.some(x=>x.person==='meryl');
  const offCommon=enzoOffReal&&merylOffReal;
  const has=de.length>0||missions.length>0;
  let evHtml='';
  de.forEach(x=>{
   if(x.type==='off') evHtml+=`<div class="ev off">✓ OFF ${x.person==='enzo'?'E':'M'}</div>`;
   else if(x.type==='travail') evHtml+=`<div class="ev ${x.person}">${x.person==='enzo'?'Enzo':'Méryl'} ${x.start_time?x.start_time.slice(0,5):''}</div>`;
  });
  missions.forEach(x=>{
   const isStart=(x.departure_date||x.date_key)===k;const isEnd=(x.arrival_date||x.date_key)===k;
   const label=isStart?`✈ ${x.person==='enzo'?'Enzo':'Méryl'} départ ${x.start_time||x.departure_date? (x.start_time||'').slice(0,5):''}`:isEnd?`🛬 arrivée ${x.end_time||''}`:`MISSION ${x.person==='enzo'?'E':'M'}`;
   evHtml+=`<div class="ev mission" title="${x.note||''}">${label}</div>`;
  });
  if(offCommon) evHtml=`<div class="ev off" style="background:#22c55e">✓ OFF COMMUN</div>`+evHtml;
  html+=`<div class="cell ${offCommon?'off-common':''}" onclick="openM('${k}')"><div class="day ${has?'has':''}">${d}</div>${evHtml}</div>`;
 }
 document.getElementById('grid').innerHTML=html;
 // counters
 const offsAll=events.filter(x=>x.type==='off');const enzoOffDays=new Set(offsAll.filter(x=>x.person==='enzo').map(x=>x.date_key));const merylOffDays=new Set(offsAll.filter(x=>x.person==='meryl').map(x=>x.date_key));let c=0;enzoOffDays.forEach(d=>{if(merylOffDays.has(d)) c++});document.getElementById('offCount').textContent=c;
 document.getElementById('missionCount').textContent=events.filter(x=>x.type==='mission').length;
}
function openM(k){selDate=k;editId=null;document.getElementById('mDate').textContent=new Date(k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const de=events.filter(x=>x.date_key===k);const missions=events.filter(x=>x.type==='mission'&&((x.departure_date||x.date_key)<=k&&(x.arrival_date||x.date_key)>=k));const all=[...de,...missions.filter(x=>x.date_key!==k)];document.getElementById('mExisting').innerHTML=[...de,...events.filter(x=>x.type==='mission'&&(x.departure_date===k||x.date_key===k))].map(x=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin:6px 0;padding:10px;background:#FAF9F6;border-radius:12px"><span><b>${x.person}</b> - ${x.type} ${x.start_time||''}→${x.end_time||''} ${x.note||''} ${x.type==='mission'?`<br><small>Du ${x.departure_date} au ${x.arrival_date}</small>`:''}</span><button onclick="editIdF('${x.id}')" style="border:none;background:#111827;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer">Modifier</button></div>`).join('')||'<div style="font-size:12px;opacity:.5">Aucun créneau ce jour</div>';document.getElementById('delBtn').style.display='none';document.getElementById('saveStatus').textContent='';setP(selP);setT(selT);document.getElementById('depD').value=k;document.getElementById('arrD').value=k;document.getElementById('modal').classList.add('open');}
function closeM(){document.getElementById('modal').classList.remove('open');}
function editIdF(id){const x=events.find(e=>e.id===id);if(!x) return;editId=id;selP=x.person;selT=x.type;selDate=x.date_key;setP(selP);setT(selT);document.getElementById('s').value=x.start_time||'09:00';document.getElementById('e').value=x.end_time||'18:00';document.getElementById('note').value=x.note||'';document.getElementById('depD').value=x.departure_date||x.date_key;document.getElementById('arrD').value=x.arrival_date||x.date_key;document.getElementById('depT').value=x.start_time||'08:00';document.getElementById('arrT').value=x.end_time||'18:00';document.getElementById('delBtn').style.display='block';}
function chg(o){cur.setMonth(cur.getMonth()+o);render();}
document.getElementById('todayBtn').onclick=()=>{cur=new Date();cur.setDate(1);render();}
async function save(){
 const isMission=selT==='mission';
 const depD=document.getElementById('depD').value||selDate;const arrD=document.getElementById('arrD').value||depD;
 const depT=document.getElementById('depT').value||document.getElementById('s').value||'08:00';
 const arrT=document.getElementById('arrT').value||document.getElementById('e').value||'18:00';
 const payload={id:(editId|| (crypto.randomUUID?crypto.randomUUID():Date.now().toString())),date_key:isMission?depD:selDate,person:selP,type:selT,start_time:isMission?depT:document.getElementById('s').value||null,end_time:isMission?arrT:document.getElementById('e').value||null,note:document.getElementById('note').value||null,is_multi_day:isMission,departure_date:isMission?depD:selDate,arrival_date:isMission?arrD:selDate};
 if(isMission) payload.id=editId|| (crypto.randomUUID?crypto.randomUUID():Date.now().toString());
 document.getElementById('saveStatus').textContent='Enregistrement...';
 try{
  let r;
  if(editId){
   const {id,...rest}=payload;r=await fetch(SUPA_URL+"/rest/v1/planning_events?id=eq."+editId,{method:"PATCH",headers:HEADERS,body:JSON.stringify(rest)});
  }else{
   r=await fetch(SUPA_URL+"/rest/v1/planning_events",{method:"POST",headers:HEADERS,body:JSON.stringify(payload)});
  }
  if(!r.ok){const txt=await r.text();throw new Error(r.status+" "+txt);}
  document.getElementById('saveStatus').textContent='✓ Enregistré !';
  closeM();await load();
 }catch(e){document.getElementById('saveStatus').textContent="❌ "+e.message;alert("Erreur: "+e.message);}
}
async function del(){if(!editId) return;if(!confirm('Supprimer ?')) return;try{const r=await fetch(SUPA_URL+"/rest/v1/planning_events?id=eq."+editId,{method:"DELETE",headers:HEADERS});if(!r.ok) throw new Error(await r.text());closeM();await load();}catch(e){alert(e.message);}}
load();setInterval(load,7000);setP('enzo');setT('off');
</script>
